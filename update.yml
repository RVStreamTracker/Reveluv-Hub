name: Update stream data

on:
  schedule:
    - cron: "0 15 * * *"   # every day at 15:00 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the latest numbers
        run: python update.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Save changes
        run: |
          git config user.name "stream-bot"
          git config user.email "stream-bot@users.noreply.github.com"
          git add data.json history.json
          git diff --staged --quiet || (git commit -m "Update stream data" && git push)
